services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: skillbridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Kartik@07
      POSTGRES_DB: SkillBridge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./ai-backend/data/processed:/data/processed

volumes:
  pgdata:
